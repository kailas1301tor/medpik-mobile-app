org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Jetifier is unnecessary with AndroidX-only deps and was jetifying the Flutter
# engine JAR (arm64_v8a_debug), which failed with "No space left on device".
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Longer timeouts — cold cache after disk cleanup needs reliable Google Maven downloads
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.http.connectionTimeout=600000
systemProp.http.socketTimeout=600000
systemProp.java.net.preferIPv4Stack=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
